async function runChatTool(name, input, sink) {
  const sym = String(input.symbol || "").trim().toUpperCase();
  if (name === "get_company_snapshot") return compactPeer(await peerMetrics(sym));
  if (name === "get_quarterly_financials") {
    const n = Math.max(2, Math.min(12, input.quarters || 8));
    const [raw, pr] = await Promise.all([api("income-statement", { symbol: sym, period: "quarter", limit: n + 4 }), api("profile", { symbol: sym }).then(x => x[0] || null).catch(() => null)]);
    const srt = [...raw].sort((a, b) => a.date < b.date ? -1 : 1).map(r => ({ ...r }));
    if (isFinancial(pr)) normalizeFinancial(srt, await api("earnings", { symbol: sym, limit: 16 }).catch(() => []));
    const rows = enrichIncome(srt).slice(-n);
    return { symbol: sym, currency: rows.length ? rows[rows.length - 1].reportedCurrency : null, quarters: rows.map(r => ({ period: r.label, periodEnd: r.date, revenue: r4(r.revenue), revQoQ_pct: pctN(r.revQoQ), revYoY_pct: pctN(r.revYoY), grossMargin_pct: pctN(r.grossProfit ? r.gm : null), opMargin_pct: pctN(r.om), netMargin_pct: pctN(r.nm), operatingIncome: r4(r.operatingIncome), netIncome: r4(r.netIncome), dilutedEPS: r4(r.epsDiluted) })) };
  }
  if (name === "get_price_history") {
    const rows = await prices(sym, input.from, input.to);
    const out = rows.length > 130 ? toWeekly(rows) : rows;
    return { symbol: sym, frequency: rows.length > 130 ? "weekly" : "daily", rows: out.map(r => [r.date, r.open, r.high, r.low, r.close, r.volume]), columns: ["date", "open", "high", "low", "close", "volume"] };
  }
  if (name === "render_chart") { sink.charts.push(input); return { rendered: true }; }
  throw new Error("Unknown tool " + name);
}

function chartFromSpec(spec) {
  const fm = spec.format || "number", cur = STATE.d ? STATE.d.currency : "USD";
  const fmt = fm === "pct" ? (v => pctPlain(v, 0)) : fm === "pp_pct" ? (v => (+v).toFixed(0) + "%") : fm === "money" ? (v => money(v, cur)) : fm === "multiple" ? (v => (+v).toFixed(1) + "×") : (v => Math.abs(v) >= 1000 ? money(v, "").replace("$", "") : (+v).toFixed(Math.abs(v) < 10 ? 2 : 0));
  const labels = (spec.labels || []).map(String).slice(0, 24);
  const series = (spec.series || []).slice(0, 6).map((s, i) => ({ name: String(s.name || "Series " + (i + 1)), color: PAL[i % PAL.length], values: labels.map((_, k) => isNum(s.values && s.values[k]) ? s.values[k] : null) }));
  if (!labels.length || !series.length) return "";
  let svg;
  if (spec.type === "line") svg = lineChart(labels, series, { fmt, title: spec.title });
  else {
    const hl = spec.highlight ? String(spec.highlight).toUpperCase() : null;
    const signed2 = series.length === 1 && !hl && (fm === "pct" || fm === "pp_pct") && series[0].values.some(v => isNum(v) && v < 0);
    const fills = series.length === 1 && hl ? labels.map(l => l.toUpperCase() === hl ? "var(--accent)" : "var(--c8)") : signed2 ? series[0].values.map(v => isNum(v) && v < 0 ? "var(--neg)" : "var(--pos)") : null;
    svg = barChart(labels, series, { fmt, fills, title: spec.title });
  }
  return `<figure class="cfig"><figcaption>${esc(spec.title || "")}</figcaption>${series.length > 1 ? legend(series) : ""}<div class="chart">${svg}</div></figure>`;
}

/* small, safe markdown: headings, bold/italic, code, lists, tables, paragraphs */
function mdInline(t) {
  return esc(t).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, "$1<i>$2</i>")
    .replace(/(^|[\s(])([+−-]?\d[\d.,]*%)/g, (m0, a, n) => `${a}<span class="${/^[−-]/.test(n) ? "dn" : /^\+/.test(n) ? "up" : ""}">${n}</span>`);
}
function md(src) {
  const lines = String(src || "").replace(/\r/g, "").split("\n"); let out = "", i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (/^\s*$/.test(l)) { i++; continue; }
    if (/^#{1,4}\s/.test(l)) { out += `<h5>${mdInline(l.replace(/^#+\s/, ""))}</h5>`; i++; continue; }
    if (/^\s*\|/.test(l) && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1])) {
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const head = cells(l); i += 2; const body = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) body.push(cells(lines[i++]));
      out += `<div class="tbl"><table><thead><tr>${head.map(h => `<th>${mdInline(h)}</th>`).join("")}</tr></thead><tbody>${body.map(r => `<tr>${r.map(c => `<td>${mdInline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
      continue;
    }
    if (/^\s*([-*•]|\d+\.)\s/.test(l)) {
      const ordered = /^\s*\d+\./.test(l); const items = [];
      while (i < lines.length && /^\s*([-*•]|\d+\.)\s/.test(lines[i])) items.push(lines[i++].replace(/^\s*([-*•]|\d+\.)\s/, ""));
      out += `<${ordered ? "ol" : "ul"}>${items.map(x => `<li>${mdInline(x)}</li>`).join("")}</${ordered ? "ol" : "ul"}>`;
      continue;
    }
    const para = []; while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^#{1,4}\s|^\s*\||^\s*([-*•]|\d+\.)\s/.test(lines[i])) para.push(lines[i++]);
    out += `<p>${mdInline(para.join(" "))}</p>`;
  }
  return out;
}

async function streamClaude(body, onEvent, signal) {
  let r;
  try {
    r = await fetch("https://api.anthropic.com/v1/messages", { method: "POST", signal,
      headers: { "content-type": "application/json", "x-api-key": chatKey(), "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
      body: JSON.stringify({ ...body, stream: true }) });
  } catch (e) { if (e.name === "AbortError") throw e; throw new Error("Couldn't reach the Anthropic API. Check your connection."); }
  if (!r.ok) {
    let m = `HTTP ${r.status}`; try { const j = await r.json(); m = (j.error && j.error.message) || m; } catch (e) {}
    const hint = r.status === 401 ? " Check your Anthropic API key in Settings." : r.status === 429 ? " Rate limited, try again in a moment." : r.status === 529 ? " The API is busy, try again shortly." : "";
    throw new Error(m + hint);
  }
  const reader = r.body.getReader(), dec = new TextDecoder(); let buf = "";
  for (;;) {
    const { value, done } = await reader.read(); if (done) break;
    buf += dec.decode(value, { stream: true });
    let k; while ((k = buf.indexOf("\n\n")) >= 0) {
      const chunk = buf.slice(0, k); buf = buf.slice(k + 2);
      const dl = chunk.split("\n").find(x => x.startsWith("data:")); if (!dl) continue;
      try { onEvent(JSON.parse(dl.slice(5))); } catch (e) {}
    }
  }
}

async function askClaude(question) {
  if (CHAT.busy || !question.trim()) return;
  if (!chatKey()) return askLocal(question);
  const d = STATE.d; if (!d) return;
  CHAT.busy = true;
  const mark = () => CHAT.msgs.length;
  if (CHAT.forSym !== d.symbol) { CHAT.msgs = []; CHAT.forSym = d.symbol; CHAT.view = []; }
  CHAT.view.push({ role: "user", text: question });
  const turn = { role: "assistant", text: "", charts: [], status: "Reading the data…", tools: [] };
  CHAT.view.push(turn); renderChat();
  try {
    if (!(STATE.peerData && STATE.peerData.for === d.symbol)) { turn.status = "Loading peer group…"; renderChatTurn(turn); await ensurePeerData().catch(() => {}); }
    var startLen = mark();
    const ctx = buildChatContext();
    const system = CHAT_SYSTEM + CHAT_LEN[chatDetail()] + "\n\nLOADED DATA (JSON):\n" + JSON.stringify(ctx);
    CHAT.msgs.push({ role: "user", content: question });
    const ac = new AbortController(); CHAT.abort = ac;
    for (let round = 0; round < 8; round++) {
      const blocks = []; let stop = null;
      turn.status = round ? "Writing…" : "Thinking…"; renderChatTurn(turn);
      await streamClaude({ model: chatModel(), max_tokens: 3000, system, tools: CHAT_TOOLS, messages: CHAT.msgs }, ev => {
        if (ev.type === "content_block_start") blocks[ev.index] = ev.content_block.type === "tool_use" ? { type: "tool_use", id: ev.content_block.id, name: ev.content_block.name, json: "" } : { type: "text", text: "" };
        else if (ev.type === "content_block_delta") {
          const b2 = blocks[ev.index]; if (!b2) return;
          if (ev.delta.type === "text_delta") { b2.text += ev.delta.text; turn.text += ev.delta.text; turn.status = ""; renderChatTurn(turn); }
          else if (ev.delta.type === "input_json_delta") b2.json += ev.delta.partial_json;
        } else if (ev.type === "message_delta" && ev.delta) stop = ev.delta.stop_reason || stop;
        else if (ev.type === "error") throw new Error((ev.error && ev.error.message) || "Stream error");
      }, ac.signal);
      const content = blocks.filter(Boolean).map(b2 => b2.type === "text" ? { type: "text", text: b2.text } : { type: "tool_use", id: b2.id, name: b2.name, input: (() => { try { return JSON.parse(b2.json || "{}"); } catch (e) { return {}; } })() }).filter(b2 => b2.type !== "text" || b2.text);
      CHAT.msgs.push({ role: "assistant", content });
      const uses = content.filter(b2 => b2.type === "tool_use");
      if (stop !== "tool_use" || !uses.length) break;
      const results = [];
      for (const u of uses) {
        const lab = u.name === "render_chart" ? "Drawing chart" : u.name === "get_price_history" ? `Fetching prices for ${u.input.symbol}` : u.name === "get_quarterly_financials" ? `Fetching financials for ${u.input.symbol}` : `Fetching ${u.input.symbol} metrics`;
        turn.tools.push(lab); turn.status = lab + "…"; renderChatTurn(turn);
        try { const res = await runChatTool(u.name, u.input, turn); results.push({ type: "tool_result", tool_use_id: u.id, content: JSON.stringify(res).slice(0, 60000) }); }
        catch (e) { results.push({ type: "tool_result", tool_use_id: u.id, content: "Error: " + (e.message || e), is_error: true }); }
        renderChatTurn(turn);
      }
      if (turn.text && !/\n\n$/.test(turn.text)) turn.text += "\n\n";
      CHAT.msgs.push({ role: "user", content: results });
    }
    // keep the conversation compact: drop whole old exchanges, always starting on a plain user question
    while (CHAT.msgs.length > 30) { CHAT.msgs.shift(); while (CHAT.msgs.length && !(CHAT.msgs[0].role === "user" && typeof CHAT.msgs[0].content === "string")) CHAT.msgs.shift(); }
  } catch (e) {
    if (e.name === "AbortError") turn.text += (turn.text ? "\n\n" : "") + "*Stopped.*";
    else turn.error = e.message || String(e);
    // roll back to a valid conversation so the next question still works
    if (typeof startLen === "number") CHAT.msgs.length = startLen;
  } finally {
    turn.status = ""; CHAT.busy = false; CHAT.abort = null; renderChat();
  }
}

async function ensurePeerData() {
  const d = STATE.d, main = d.symbol;
  let syms = STATE.peerFor === main && STATE.peers ? STATE.peers : null;

  if (!syms) syms = await suggestedPeers(main);
  const all = [main, ...syms.filter(s => s !== main)];
  const res = await Promise.allSettled(all.map(peerMetrics));
  const ok = [], errs = {};
  res.forEach((r, i) => r.status === "fulfilled" ? ok.push(r.value) : errs[all[i]] = r.reason && r.reason.message);
  const me = ok.find(x => x.sym === main);
  if (me) STATE.peerData = { for: main, me, peers: ok.filter(x => x.sym !== main), errs };
}

  pane.querySelectorAll("[data-eng]").forEach(b => b.addEventListener("click", () => { pane.querySelectorAll("[data-eng]").forEach(x => x.setAttribute("aria-pressed", String(x === b))); STATE.engPick = b.dataset.eng; }));

/* ============ built-in answer engine: answers from the FMP data, no AI key needed ============ */
const NOT_TICKERS = new Set(["I", "A", "AN", "THE", "QOQ", "YOY", "EPS", "FCF", "EV", "PE", "TTM", "US", "UK", "AI", "CEO", "CFO", "FY", "OK", "EBITDA", "GAAP", "SGA", "RD", "IS", "IT", "VS", "AND", "OR", "TO", "OF", "IN", "ON", "FOR", "ME", "MY", "DO", "DID", "HOW", "WHAT", "WHY", "Q", "PT", "ROIC", "ROE", "OK", "USD", "GBP", "EUR", "TAM", "YTD", "LTM", "NTM", "EST", "ETF"]);
const INTENTS = [
  ["reaction", /(react|reaction|traded|trade around|share price|stock (move|do|did|react)|price (move|action|reaction)|sold off|sell[- ]?off|rall(y|ied)|how did (the )?(stock|shares))/],
  ["valuation", /(valu|cheap|expensive|multiple|p\/e|\bpe\b|ev\/|premium|discount|\brich\b|overvalued|undervalued|price target|upside|downside|re-?rate)/],
  ["guidance", /(guidance|\bguide[ds]?\b|outlook|full[- ]year|this year|current year|fiscal year|\bfy\d*\b|annual target)/],
  ["earnings", /(earnings|estimate|consensus|beat|miss|next quarter|print|forecast|expect|watch|upcoming|results day|report)/],
  ["peers", /(peer|compet|compare|relative to|rank|sector)/],
  ["margins", /(margin|profitab|cost|opex|expense|operating leverage|gross profit|operating income)/],
  ["growth", /(grow|driv|revenue|sales|top ?line|segment|business unit|product|region|geograph|where .*(grow|com))/],
  ["balance", /(balance sheet|debt|net cash|cash position|liquidity|leverage|inventory|receivable|working capital|solven)/],
  ["cash", /(cash ?flow|\bfcf\b|free cash|buyback|repurchase|dividend|capital return|capex|shareholder return)/],
  ["eps", /(\beps\b|earnings per share|net income|bottom line|profit\b)/],
  ["summary", /(summar|overview|tell me about|snapshot|key points|tl;?dr|thesis|story|bull|bear|risk)/]
];

function detectIntents(q) {
  const s = q.toLowerCase(), hits = INTENTS.filter(([, re]) => re.test(s)).map(([k]) => k);
  let out = hits;
  if (out.includes("reaction") || out.includes("guidance")) out = out.filter(k => k !== "earnings");
  if (out.includes("valuation") && out.includes("peers")) out = out.filter(k => k !== "peers");
  if (out.includes("peers") && (out.includes("margins") || out.includes("growth"))) out = out.filter(k => k !== "margins" && k !== "growth");
  return out.slice(0, 2);
}
function detectTickers(q, d) {
  const known = new Set([...(STATE.peerData && STATE.peerData.for === d.symbol ? STATE.peerData.peers.map(p => p.sym) : []), ...(STATE.peers || [])]);
  const out = new Set();
  (q.match(/\b[A-Z]{1,5}(\.[A-Z]{1,3})?\b/g) || []).forEach(t => { if (!NOT_TICKERS.has(t) && t !== d.symbol) out.add(t); });
  q.split(/[^A-Za-z.]+/).forEach(t => { const u = t.toUpperCase(); if (known.has(u)) out.add(u); });
  return [...out].slice(0, 4);
}
const detectMode = q => /yoy|year[- ]on[- ]year|year[- ]over[- ]year|vs last year|annual/i.test(q) ? "yoy" : /qoq|quarter[- ]on[- ]quarter|sequential|vs last quarter/i.test(q) ? "qoq" : MODE();

const signed = (v, cur) => isNum(v) ? money(v, cur).replace(/^(?!−)/, v > 0 ? "+" : "") : "—";
const tbl = (head, rows) => `<div class="tbl"><table><thead><tr>${head.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
const ul = items => items.filter(Boolean).length ? `<ul>${items.filter(Boolean).map(x => `<li>${x}</li>`).join("")}</ul>` : "";
const h = t => `<h5>${t}</h5>`;
const tone = v => `<span class="${cls(v)}">${pct(v)}</span>`;

function ansGrowth(d, m) {
  const cur = d.currency, q = d.inc, n = q.length, L = q[n - 1], P = q[n - 2], w = m === "qoq" ? "QoQ" : "YoY";
  const yi = yearAgoIdx(q, n - 1), g = m === "qoq" ? L.revQoQ : L.revYoY;
  const seasonal = yi >= 1 ? growth(q[yi].revenue, q[yi - 1].revenue) : null;
  let html = `<p><b>${esc(d.symbol)} revenue ${pct(g)} ${w}</b> in ${esc(L.label)} to ${money(L.revenue, cur)} (${m === "qoq" ? `${pct(L.revYoY)} YoY` : `${pct(L.revQoQ)} QoQ`}).`;
  if (m === "qoq" && isNum(seasonal)) html += ` The same quarter last year moved ${pct(seasonal)}, so this is ${Math.abs(L.revQoQ - seasonal) < 0.015 ? "in line with normal seasonality" : L.revQoQ > seasonal ? "<b>better than</b> the usual seasonal pattern" : "<b>weaker than</b> the usual seasonal pattern"}.`;
  if (m === "yoy" && P && isNum(P.revYoY)) html += ` Growth is ${Math.abs(L.revYoY - P.revYoY) < 0.01 ? "steady" : L.revYoY > P.revYoY ? "<b>accelerating</b>" : "<b>slowing</b>"} from ${pct(P.revYoY)} in ${esc(P.label)}.`;
  html += `</p>`;
  const charts = [];
  const segBlock = (seg, title) => {
    const sa = segmentAnalysis(seg, m); if (!sa) return "";
    const items = sa.items.filter(i => isNum(i.delta)).sort((a, b) => b.delta - a.delta);
    const note = sa.eff === "fy" ? ` <span class="muted">(annual data: ${esc(sa.cur.label)} vs ${esc(sa.prev.label)})</span>` : ` <span class="muted">(${esc(sa.cur.label)} vs ${esc(sa.prev.label)})</span>`;
    const rows = items.map(i => [esc(i.name), money(i.cur, cur), tone(i.chg), `<span class="${cls(i.contribPP)}">${pp(i.contribPP)}</span>`, pctPlain(i.share)]);
    const lead = sa.dTot >= 0 ? items[0] : items[items.length - 1];
    const lines = [];
    if (lead) lines.push(sa.dTot >= 0 ? `<b>${esc(lead.name)}</b> is the biggest driver: ${signed(lead.delta, cur)} (${pct(lead.chg)}), ${pp(lead.contribPP)} of the ${pct(sa.totGrowth)} total.` : `<b>${esc(lead.name)}</b> is the biggest drag: ${signed(lead.delta, cur)} (${pct(lead.chg)}).`);
    const fast = items.filter(i => isNum(i.share) && i.share >= 0.03 && isNum(i.chg)).sort((a, b) => b.chg - a.chg)[0];
    if (fast && fast !== lead) lines.push(`Fastest grower: ${esc(fast.name)} ${pct(fast.chg)}.`);
    const dec = items.filter(i => isNum(i.chg) && i.chg < 0 && i !== lead);
    if (dec.length) lines.push(`Declining: ${dec.map(i => `${esc(i.name)} ${pct(i.chg)}`).join(", ")}.`);
    if (!charts.length && items.length > 1) charts.push({ type: "bar", title: `${title}: % change ${sa.cmpLabel}`, labels: items.map(i => i.name.length > 14 ? i.name.slice(0, 13) + "…" : i.name), series: [{ name: "% change", values: items.map(i => isNum(i.chg) ? i.chg : null) }], format: "pct" });
    return h(`${title}${note}`) + ul(lines) + tbl(["", sa.cur.label, `% ${sa.cmpLabel}`, "Contrib.", "Share"], rows);
  };
  html += segBlock(d.seg, "By business unit") + segBlock(d.geo, "By region");
  if (!d.seg && !d.geo) html += `<p class="muted">No segment breakdown is available for ${esc(d.symbol)} from FMP.</p>`;
  return { html, charts };
}

function ansMargins(d, m) {
  const cur = d.currency, q = d.inc, n = q.length, L = q[n - 1], P = q[n - 2], yi = yearAgoIdx(q, n - 1), Y = yi >= 0 ? q[yi] : null;
  const B = m === "qoq" ? P : Y, w = m === "qoq" ? "QoQ" : "YoY";
  const dGm = B && isNum(L.gm) && isNum(B.gm) ? L.gm - B.gm : null, dOm = B ? L.om - B.om : null, dNm = B ? L.nm - B.nm : null;
  let html = d.isFin ? `<p><b>Pre-tax margin ${pctPlain(L.om)}</b> in ${esc(L.label)}, ${bps(dOm)} ${w}; net ${pctPlain(L.nm)} (${bps(dNm)}). Efficiency ratio ${pctPlain(L.eff)} (${bps(B ? L.eff - B.eff : null)}, lower is better).</p>`
    : `<p><b>Operating margin ${pctPlain(L.om)}</b> in ${esc(L.label)}, ${bps(dOm)} ${w}. Gross ${pctPlain(L.grossProfit ? L.gm : null)} (${bps(dGm)}), net ${pctPlain(L.nm)} (${bps(dNm)}).</p>`;
  const lines = [];
  if (isNum(dGm) && isNum(dOm) && L.grossProfit) lines.push(Math.abs(dGm) > Math.abs(dOm) * 0.6 ? `Most of the move is at the gross line, so pricing, mix and product costs explain it.` : `Most of the move is below gross profit, in operating costs.`);
  if (B) {
    const og = growth(L.operatingExpenses, B.operatingExpenses), rg = growth(L.revenue, B.revenue);
    if (isNum(og) && isNum(rg)) lines.push(`Operating expenses ${pct(og)} vs revenue ${pct(rg)} ${w}: ${og < rg - 0.01 ? "<b>operating leverage</b>" : og > rg + 0.01 ? "<b>costs outpacing sales</b>" : "costs in line with sales"}.`);
    const dRev = L.revenue - B.revenue, dOI = L.operatingIncome - B.operatingIncome;
    if (Math.abs(dRev) > 0 && isNum(dOI)) lines.push(`Incremental operating margin ${pctPlain(dOI / dRev, 0)} (each extra dollar of revenue ${dRev > 0 ? "added" : "removed"} ${(dOI / dRev).toFixed(2)} of operating profit).`);
  }
  const trend = q.slice(-4).map(r => r.om).filter(isNum);
  if (trend.length >= 3) { const up = trend[trend.length - 1] - trend[0]; lines.push(`Over the last 4 quarters operating margin has moved ${bps(up)}${Math.abs(up) < 0.005 ? " (broadly flat)" : up > 0 ? " (trending up)" : " (trending down)"}.`); }
  if (d.fc && isNum(d.fc.mOm)) lines.push(`On the tool's simple model, next quarter's operating margin would be about ${pctPlain(d.fc.mOm)}.`);
  html += ul(lines);
  const rows = q.slice(-5).map(r => [esc(r.label), pctPlain(r.grossProfit ? r.gm : null), pctPlain(r.om), pctPlain(r.nm), pctPlain(r.researchAndDevelopmentExpenses ? r.rdPct : null), pctPlain(r.sellingGeneralAndAdministrativeExpenses ? r.sgaPct : null)]);
  html += tbl(["Quarter", "Gross", "Operating", "Net", "R&amp;D % rev", "SG&amp;A % rev"], rows);
  const s8 = q.slice(-8);
  return { html, charts: [{ type: "line", title: "Margins by quarter", labels: s8.map(r => r.label), series: [{ name: "Gross", values: s8.map(r => r.grossProfit ? r.gm : null) }, { name: "Operating", values: s8.map(r => r.om) }, { name: "Net", values: s8.map(r => r.nm) }], format: "pct" }] };
}

async function withPeers(d, turn, extra) {
  if (!(STATE.peerData && STATE.peerData.for === d.symbol)) { turn.status = "Loading peer group from FMP…"; renderChatTurn(turn); await ensurePeerData(); }
  const pd = STATE.peerData; if (!pd) throw new Error("Couldn't load peer data.");
  let peers = [...pd.peers];
  for (const t of extra || []) {
    if (peers.some(p => p.sym === t)) continue;
    turn.tools.push(`Fetched ${t} from FMP`); turn.status = `Fetching ${t}…`; renderChatTurn(turn);
    try { peers.push(await peerMetrics(t)); } catch (e) { turn.tools.push(`${t} not found`); }
  }
  return { me: pd.me, peers };
}

async function ansValuation(d, m, turn, extra) {
  const { me, peers } = await withPeers(d, turn, extra), cur = d.currency;
  const set = extra && extra.length ? peers.filter(p => extra.includes(p.sym)) : peers;
  const mv = get => median(set.map(get).filter(multOk));
  const metrics = [["P/E (TTM)", x => x.pe], ["Forward P/E", x => x.fpe], ["EV/Sales", x => x.evS], ["EV/EBITDA", x => x.evE], ["P/FCF", x => x.pfcf]];
  const rows = metrics.map(([lab, get]) => { const v = get(me), mm = mv(get); return [lab, mult(v), mult(mm), multOk(v) && isNum(mm) ? `<span class="${v > mm ? "dn" : "up"}">${pct(v / mm - 1, 0)} ${v > mm ? "premium" : "discount"}</span>` : "—"]; });
  const prem = median(metrics.map(([, get]) => { const v = get(me), mm = mv(get); return multOk(v) && isNum(mm) ? v / mm - 1 : null; }));
  const g = x => x.revYoY, om = x => x.omT;
  const gM = median(set.map(g)), omM = median(set.map(om));
  const faster = isNum(g(me)) && isNum(gM) ? g(me) > gM : null, richer = isNum(om(me)) && isNum(omM) ? om(me) > omM : null;
  let verdict = !isNum(prem) ? "There isn't enough valuation data to compare." :
    prem > 0.15 ? `<b>${esc(d.symbol)} trades at a premium</b> (a median ${pct(prem, 0)} across multiples) ${faster && richer ? "that faster growth and higher margins support." : faster || richer ? `that is partly backed by ${faster ? "faster growth" : "higher margins"}.` : "that growth and margins don't obviously justify."}` :
    prem < -0.15 ? `<b>${esc(d.symbol)} trades at a discount</b> (a median ${pct(prem, 0)} across multiples) ${faster ? "despite faster growth, which can point to value or a market concern worth checking." : "consistent with slower growth."}` :
    `<b>${esc(d.symbol)} is valued broadly in line with peers</b> (a median ${pct(prem, 0)} across multiples).`;
  let html = `<p>${verdict}</p>` + ul([
    isNum(g(me)) && isNum(gM) ? `Revenue growth ${pct(g(me))} YoY vs peer median ${pct(gM)}.` : "",
    isNum(om(me)) && isNum(omM) ? `TTM operating margin ${pctPlain(om(me))} vs median ${pctPlain(omM)} (${pp(om(me) - omM)}).` : "",
    isNum(me.fcfY) ? `FCF yield ${pctPlain(me.fcfY)} vs median ${pctPlain(median(set.map(x => x.fcfY)))}.` : "",
    d.fc && d.fc.pt ? `Analyst price target ${d.fc.pt.targetConsensus.toFixed(2)}, ${pct(d.fc.pt.upside)} from the current price (range ${d.fc.pt.targetLow}–${d.fc.pt.targetHigh}).` : ""
  ]) + tbl(["Multiple", esc(d.symbol), `Peer median (${set.length})`, "vs median"], rows) + `<p class="muted">Peers: ${set.map(p => esc(p.sym)).join(", ")}. Edit the group on the Peers &amp; valuation tab.</p>`;
  const all = [me, ...set];
  return { html, charts: [{ type: "bar", title: "EV/EBITDA vs peers", labels: all.map(x => x.sym), series: [{ name: "EV/EBITDA", values: all.map(x => multOk(x.evE) ? x.evE : null) }], format: "multiple", highlight: d.symbol }] };
}

async function ansPeers(d, m, turn, extra, focus) {
  const { me, peers } = await withPeers(d, turn, extra);
  const set = extra && extra.length ? peers.filter(p => extra.includes(p.sym)) : peers, all = [me, ...set];
  const w = m === "qoq" ? "QoQ" : "YoY", g = x => m === "qoq" ? x.revQoQ : x.revYoY;
  const rank = (get, hi = true) => { const a = all.filter(x => isNum(get(x))).sort((x, y) => hi ? get(y) - get(x) : get(x) - get(y)); const i = a.indexOf(me); return i >= 0 ? `${i + 1} of ${a.length}` : "—"; };
  const ref = set.length === 1 ? esc(set[0].sym) : "median";
  const lines = [
    isNum(g(me)) ? `Revenue growth ${pct(g(me))} ${w}, ranking <b>${rank(g)}</b> (${ref} ${pct(median(set.map(g)))}).${m === "qoq" ? " Fiscal calendars differ, so QoQ can reflect seasonality." : ""}` : "",
    isNum(me.omT) ? `TTM ${me.fin ? "pre-tax" : "operating"} margin ${pctPlain(me.omT)}, ranking <b>${rank(x => x.omT)}</b> (${ref} ${pctPlain(median(set.map(x => x.omT)))}).` : "",
    isNum(me.gmT) ? `TTM gross margin ${pctPlain(me.gmT)} vs ${ref} ${pctPlain(median(set.map(x => x.gmT)))}.` : "",
    isNum(me.fpe) || isNum(me.evE) ? `Valuation: EV/EBITDA ${mult(me.evE)} (rank ${rank(x => multOk(x.evE) ? x.evE : null, false)} cheapest), forward P/E ${mult(me.fpe)}.` : ""
  ];
  const ord = focus === "margins" ? [lines[1], lines[2], lines[0], lines[3]] : lines;
  const rows = all.map(x => [`${x === me ? "<b>" : ""}${esc(x.sym)}${x === me ? "</b>" : ""}`, tone(g(x)), pctPlain(x.gmT), pctPlain(x.omT), pctPlain(x.nmT), mult(x.evE), mult(x.fpe)]);
  if (set.length > 1) rows.push(["Median (peers)", pct(median(set.map(g))), pctPlain(median(set.map(x => x.gmT))), pctPlain(median(set.map(x => x.omT))), pctPlain(median(set.map(x => x.nmT))), mult(median(set.map(x => x.evE).filter(multOk))), mult(median(set.map(x => x.fpe).filter(multOk)))]);
  const html = `<p><b>${esc(d.symbol)} vs ${set.map(p => esc(p.sym)).join(", ")}</b></p>` + ul(ord) + tbl(["", `Rev ${w}`, "Gross", "Op.", "Net", "EV/EBITDA", "Fwd P/E"], rows) + `<p class="muted">Margins are TTM; growth is each company's latest reported quarter.</p>`;
  const chart = focus === "growth" ? { type: "bar", title: `Revenue growth ${w}`, labels: all.map(x => x.sym), series: [{ name: "Growth", values: all.map(g) }], format: "pct", highlight: d.symbol }
    : { type: "bar", title: "TTM operating margin", labels: all.map(x => x.sym), series: [{ name: "Operating margin", values: all.map(x => x.omT) }], format: "pct", highlight: d.symbol };
  return { html, charts: [chart] };
}

function ansEarnings(d, m) {
  const f = d.fc, cur = d.currency; if (!f) return { html: `<p>No estimate data is available for ${esc(d.symbol)}.</p>` };
  const lines = [];
  let lead;
  if (isNum(f.cRev)) lead = `<p><b>${esc(f.label)} reports ${f.date ? esc(fmtDate(f.date)) : "next"}.</b> Consensus expects revenue of <b>${money(f.cRev, cur)}</b> (${pct(f.cRevQoQ)} QoQ, ${pct(f.cRevYoY)} YoY)${isNum(f.cEps) ? ` and EPS of <b>${f.cEps.toFixed(2)}</b> (${pct(f.cEpsYoY)} YoY)` : ""}.</p>`;
  else lead = `<p>There's no consensus estimate for ${esc(f.label)} in the FMP data. The tool's model projects ${money(f.mRev, cur)} (${pct(f.mRevQoQ)} QoQ).</p>`;
  if (isNum(f.cRevYoY) && isNum(f.L.revYoY)) lines.push(`That implies YoY growth ${Math.abs(f.cRevYoY - f.L.revYoY) < 0.01 ? "steady at" : f.cRevYoY > f.L.revYoY ? "<b>accelerating</b> from" : "<b>slowing</b> from"} ${pct(f.L.revYoY)} last quarter.`);
  if (isNum(f.mRev) && isNum(f.cRev)) lines.push(`The tool's seasonal model lands at ${money(f.mRev, cur)}, ${pct(f.modelVsCons)} vs consensus, ${Math.abs(f.modelVsCons) < 0.015 ? "so consensus looks reasonable on history" : f.modelVsCons > 0 ? "so consensus looks <b>beatable</b> on recent trends" : "so consensus looks <b>demanding</b> on recent trends"}.`);
  if (f.revTrack) lines.push(`Revenue has beaten in <b>${f.revTrack.beats} of the last ${f.revTrack.n}</b> reports (average surprise ${pct(f.revTrack.avg)})${isNum(f.cRev) && isNum(f.revTrack.avg) ? `; a typical beat would mean about ${money(f.cRev * (1 + f.revTrack.avg), cur)}` : ""}.`);
  if (f.epsTrack) lines.push(`EPS has beaten ${f.epsTrack.beats} of ${f.epsTrack.n} (average ${pct(f.epsTrack.avg)}).`);
  // what to watch
  const watch = [];
  const sa = segmentAnalysis(d.seg, "yoy") || segmentAnalysis(d.seg, "qoq");
  if (sa) {
    const it = sa.items.filter(i => isNum(i.chg) && isNum(i.share) && i.share >= 0.05);
    const best = [...it].sort((a, b) => b.chg - a.chg)[0], worst = [...it].sort((a, b) => a.chg - b.chg)[0];
    if (best) watch.push(`Whether <b>${esc(best.name)}</b> keeps its momentum (${pct(best.chg)} ${sa.cmpLabel}, ${pctPlain(best.share)} of revenue).`);
    if (worst && worst !== best && worst.chg < 0.02) watch.push(`Any stabilisation in <b>${esc(worst.name)}</b> (${pct(worst.chg)} ${sa.cmpLabel}).`);
  }
  const L = f.L, yi = yearAgoIdx(d.inc, d.inc.length - 1), Y = yi >= 0 ? d.inc[yi] : null;
  if (Y && isNum(L.om) && isNum(Y.om)) watch.push(`Operating margin: ${pctPlain(L.om)} last quarter (${bps(L.om - Y.om)} YoY)${isNum(f.mOm) ? `, model points to about ${pctPlain(f.mOm)}` : ""}.`);
  if (f.ya && isNum(f.cRevQoQ) && yi >= 0) { const sq = d.inc.find(r => r.label === f.ya.label), si = d.inc.indexOf(sq); const s2 = si >= 1 ? growth(sq.revenue, d.inc[si - 1].revenue) : null; if (isNum(s2)) watch.push(`Seasonality: consensus implies ${pct(f.cRevQoQ)} QoQ vs ${pct(s2)} in the same quarter last year.`); }
  watch.push(`Guidance for the following quarter, which FMP doesn't carry, often moves the stock more than the print itself.`);
  let html = lead + ul(lines) + h("What to watch") + ul(watch);
  if (f.annual && f.annual.length) html += h("Full-year consensus") + tbl(["", ...f.annual.map(a => esc(a.label))], [["Revenue", ...f.annual.map(a => money(a.rev, cur))], ["Growth", ...f.annual.map(a => tone(a.revG))], ["EPS", ...f.annual.map(a => isNum(a.eps) ? a.eps.toFixed(2) : "—")], ["Fwd P/E", ...f.annual.map(a => mult(a.fpe))]]);
  const hist = f.hist.filter(x => isNum(x.estRev));
  const labels = [...hist.map(x => x.label), ...f.ups.slice(0, 1).map(u => u.label + "E")];
  return { html, charts: labels.length > 1 ? [{ type: "bar", title: "Revenue: actual vs consensus", labels, series: [{ name: "Actual", values: [...hist.map(x => x.rev), null] }, { name: "Consensus", values: [...hist.map(x => x.estRev), ...f.ups.slice(0, 1).map(u => u.revenueEstimated)] }], format: "money" }] : [] };
}

async function ansReaction(d, m, turn, q) {
  const f = d.fc; if (!f || !f.past.length) return { html: `<p>No past earnings dates are available for ${esc(d.symbol)}.</p>` };
  const nm = +(q.match(/\b(\d{1,2})\b/) || [])[1] || 4, reps = f.past.slice(-Math.min(8, Math.max(1, nm)));
  turn.status = "Fetching daily prices from FMP…"; renderChatTurn(turn);
  const from = addDays(reps[0].date, -35), to = [addDays(reps[reps.length - 1].date, 35), todayISO()].sort()[0];
  const px = await prices(d.symbol, from, to); turn.tools.push(`Fetched ${d.symbol} daily OHLC`);
  const res = reps.map(e => {
    const before = px.filter(r => r.date < e.date), after = px.filter(r => r.date > e.date);
    const c0 = before[before.length - 1], a1 = after[0];
    const pre = px.filter(r => r.date >= addDays(e.date, -30) && r.date < e.date)[0];
    const post = px.filter(r => r.date > e.date && r.date <= addDays(e.date, 30)); const pEnd = post[post.length - 1];
    return { lab: e.rowIdx >= 0 ? d.inc[e.rowIdx].label : fmtDate(e.date), date: e.date, revS: e.revS, epsS: e.epsS, react: c0 && a1 ? growth(a1.close, c0.close) : null, run: pre && c0 ? growth(c0.close, pre.close) : null, drift: a1 && pEnd && pEnd !== a1 ? growth(pEnd.close, a1.close) : null };
  });
  const rx = res.filter(r => isNum(r.react)), avgAbs = mean(rx.map(r => Math.abs(r.react)));
  const ups = rx.filter(r => r.react > 0).length, beatDown = rx.filter(r => isNum(r.revS) && r.revS > 0 && r.react < 0);
  const big = [...rx].sort((a, b) => Math.abs(b.react) - Math.abs(a.react))[0];
  const html = `<p><b>${esc(d.symbol)} rose after ${ups} of the last ${rx.length} reports</b>, with an average move of ±${pctPlain(avgAbs)} (close before the report to the close after).</p>` + ul([
    big ? `Biggest reaction: ${esc(big.lab)} at ${tone(big.react)}${isNum(big.revS) ? ` on a ${pct(big.revS)} revenue ${big.revS >= 0 ? "beat" : "miss"}` : ""}.` : "",
    beatDown.length ? `Beat but sold off: ${beatDown.map(r => `${esc(r.lab)} (${pct(r.react)})`).join(", ")}, so beats alone haven't been enough.` : `Beats have generally been rewarded.`,
    isNum(mean(rx.map(r => r.drift))) ? `Average 30-day drift after the report: ${tone(mean(rx.map(r => r.drift)))}.` : ""
  ]) + tbl(["Quarter", "Reaction", "Rev surprise", "EPS surprise", "Drift 30d", "Run-up 30d", "Reported"], res.slice().reverse().map(r => [esc(r.lab), `<b>${tone(r.react)}</b>`, tone(r.revS), tone(r.epsS), tone(r.drift), tone(r.run), esc(shortDate(r.date))]))
    + `<p class="muted">Click any row in Estimates vs actuals to see the candlestick chart around that report.</p>`;
  return { html, charts: [{ type: "bar", title: "Share-price reaction to earnings", labels: res.map(r => r.lab), series: [{ name: "Reaction", values: res.map(r => r.react) }], format: "pct" }] };
}

function ansBalance(d) {
  const cur = d.currency, b = d.bs; if (!b.length) return { html: "<p>No balance sheet data.</p>" };
  const L = b[b.length - 1], Y = b.length >= 5 ? b[b.length - 5] : b[0];
  const nd = L.netDebt, cr = ratio(L.totalCurrentAssets, L.totalCurrentLiabilities), de = ratio(L.totalDebt, L.totalStockholdersEquity);
  const ebitda = sum(d.inc.slice(-4).map(r => r.ebitda));
  const html = `<p><b>${isNum(nd) ? (nd < 0 ? `Net cash of ${money(-nd, cur)}` : `Net debt of ${money(nd, cur)}`) : "Net debt unavailable"}</b> at ${esc(L.label)}${isNum(Y.netDebt) ? `, versus ${Y.netDebt < 0 ? "net cash " + money(-Y.netDebt, cur) : "net debt " + money(Y.netDebt, cur)} a year earlier` : ""}.</p>` + ul([
    isNum(ebitda) && isNum(nd) && ebitda > 0 ? `Net debt / TTM EBITDA ${(nd / ebitda).toFixed(2)}×.` : "",
    isNum(cr) ? `Current ratio ${cr.toFixed(2)}${cr < 1 ? " (below 1, normal for companies with strong cash generation, but worth noting)" : ""}.` : "",
    isNum(de) ? `Debt / equity ${de.toFixed(2)}×${L.totalStockholdersEquity < 0 ? " (equity is negative, usually from buybacks)" : ""}.` : "",
    isNum(growth(L.inventory, Y.inventory)) && L.inventory > 0 ? `Inventory ${pct(growth(L.inventory, Y.inventory))} YoY vs revenue ${pct(d.inc[d.inc.length - 1].revYoY)}.` : "",
    isNum(growth(L.netReceivables, Y.netReceivables)) ? `Receivables ${pct(growth(L.netReceivables, Y.netReceivables))} YoY.` : ""
  ]) + tbl(["", esc(L.label), esc(Y.label), "Change"], [["Cash &amp; ST investments", L.cashAndShortTermInvestments, Y.cashAndShortTermInvestments], ["Total debt", L.totalDebt, Y.totalDebt], ["Net debt", L.netDebt, Y.netDebt], ["Total assets", L.totalAssets, Y.totalAssets], ["Equity", L.totalStockholdersEquity, Y.totalStockholdersEquity]].map(([k, a, c]) => [k, money(a, cur), money(c, cur), signed(isNum(a) && isNum(c) ? a - c : null, cur)]));
  const s = b.slice(-8);
  return { html, charts: [{ type: "bar", title: "Cash vs total debt", labels: s.map(r => r.label), series: [{ name: "Cash & ST inv.", values: s.map(r => r.cashAndShortTermInvestments) }, { name: "Total debt", values: s.map(r => r.totalDebt) }], format: "money" }] };
}

function ansCash(d) {
  const cur = d.currency, c = d.cf; if (c.length < 4) return { html: "<p>Not enough cash flow history.</p>" };
  const t = c.slice(-4), tp = c.slice(-8, -4);
  const S = (arr, k) => sum(arr.map(x => n0(x[k])));
  const fcf = S(t, "freeCashFlow"), fcfP = tp.length === 4 ? S(tp, "freeCashFlow") : null, ocf = S(t, "operatingCashFlow"), capex = Math.abs(S(t, "capitalExpenditure"));
  const rev = sum(d.inc.slice(-4).map(r => r.revenue)), ni = sum(d.inc.slice(-4).map(r => r.netIncome));
  const buy = Math.abs(S(t, "commonStockRepurchased")), div = Math.abs(S(t, "commonDividendsPaid")), sbc = S(t, "stockBasedCompensation");
  const html = `<p><b>TTM free cash flow ${money(fcf, cur)}</b>${isNum(fcfP) ? ` (${pct(growth(fcf, fcfP))} vs the prior 12 months)` : ""}, a ${pctPlain(ratio(fcf, rev))} FCF margin.</p>` + ul([
    isNum(ratio(fcf, ni)) ? `Cash conversion: FCF is ${pctPlain(ratio(fcf, ni), 0)} of net income${ratio(fcf, ni) < 0.8 ? ", weaker than earnings suggest" : ""}.` : "",
    `Operating cash flow ${money(ocf, cur)}; capex ${money(capex, cur)} (${pctPlain(ratio(capex, rev))} of revenue).`,
    buy || div ? `Returned ${money(buy + div, cur)} to shareholders: ${money(buy, cur)} buybacks and ${money(div, cur)} dividends (${pctPlain(ratio(buy + div, fcf), 0)} of FCF).` : "",
    sbc ? `Stock-based compensation ${money(sbc, cur)} (${pctPlain(ratio(sbc, rev))} of revenue), which FCF doesn't deduct.` : ""
  ]);
  const s = c.slice(-8);
  return { html, charts: [{ type: "bar", title: "Free cash flow by quarter", labels: s.map(r => r.label), series: [{ name: "FCF", values: s.map(r => r.freeCashFlow) }], format: "money" }] };
}

function ansEps(d, m) {
  const q = d.inc, n = q.length, L = q[n - 1], P = q[n - 2], yi = yearAgoIdx(q, n - 1), Y = yi >= 0 ? q[yi] : null, cur = d.currency;
  const sh = Y ? growth(L.weightedAverageShsOutDil, Y.weightedAverageShsOutDil) : null;
  const html = `<p><b>Diluted EPS ${isNum(L.epsDiluted) ? L.epsDiluted.toFixed(2) : "—"}</b> in ${esc(L.label)}: ${pct(Y ? growth(L.epsDiluted, Y.epsDiluted) : null)} YoY, ${pct(growth(L.epsDiluted, P.epsDiluted))} QoQ. Net income ${money(L.netIncome, cur)}, a ${pctPlain(L.nm)} net margin.</p>` + ul([
    isNum(sh) ? `Diluted share count ${pct(sh)} YoY${sh < -0.005 ? ", so buybacks are lifting EPS growth above net income growth" : ""}.` : "",
    Y && isNum(L.taxRate) && isNum(Y.taxRate) && Math.abs(L.taxRate - Y.taxRate) > 0.02 ? `Tax rate ${pctPlain(L.taxRate)} vs ${pctPlain(Y.taxRate)} a year ago, which affects the comparison.` : "",
    d.fc && isNum(d.fc.cEps) ? `Consensus for ${esc(d.fc.label)}: ${d.fc.cEps.toFixed(2)} (${pct(d.fc.cEpsYoY)} YoY).` : ""
  ]) + tbl(["Quarter", "EPS", "YoY", "Net income", "Net margin"], q.slice(-5).map((r, i, a) => { const j = yearAgoIdx(q, q.indexOf(r)); return [esc(r.label), isNum(r.epsDiluted) ? r.epsDiluted.toFixed(2) : "—", tone(j >= 0 ? growth(r.epsDiluted, q[j].epsDiluted) : null), money(r.netIncome, cur), pctPlain(r.nm)]; }));
  const s = q.slice(-8);
  return { html, charts: [{ type: "bar", title: "Diluted EPS by quarter", labels: s.map(r => r.label), series: [{ name: "EPS", values: s.map(r => r.epsDiluted) }], format: "number" }] };
}

function ansSummary(d) {
  const html = `<p>${esc(d.ins.verdict)}</p>` + ul(d.ins.list.map(i => `<b>${esc(i.tag.split(" · ")[0])}:</b> ${esc(i.title)}`)) + `<p class="muted">Ask about any of these for the detail, e.g. "margins", "valuation vs peers", "what to watch into the print".</p>`;
  return { html };
}

async function answerLocal(q, turn) {
  const d = STATE.d, m = detectMode(q), extra = detectTickers(q, d);
  let intents = detectIntents(q);
  if (extra.length && !intents.includes("peers") && !intents.includes("valuation")) intents = ["peers", ...intents].slice(0, 2);
  if (!intents.length && CHAT.lastIntent && q.trim().split(/\s+/).length <= 6) intents = [CHAT.lastIntent];
  if (!intents.length) intents = ["summary"];
  CHAT.lastIntent = intents[0];
  const wantChart = /(chart|plot|graph|visual|show me)/i.test(q);
  const focus = /margin|profit/i.test(q) ? "margins" : /grow|revenue|sales/i.test(q) ? "growth" : null;
  const parts = [];
  for (const it of intents) {
    turn.status = "Reading FMP data…"; renderChatTurn(turn);
    if (it === "growth") parts.push(ansGrowth(d, m));
    else if (it === "margins") parts.push(ansMargins(d, m));
    else if (it === "valuation") parts.push(await ansValuation(d, m, turn, extra));
    else if (it === "peers") parts.push(await ansPeers(d, m, turn, extra, focus));
    else if (it === "earnings") parts.push(ansEarnings(d, m));
    else if (it === "reaction") parts.push(await ansReaction(d, m, turn, q));
    else if (it === "balance") parts.push(ansBalance(d));
    else if (it === "cash") parts.push(ansCash(d));
    else if (it === "eps") parts.push(ansEps(d, m));
    else if (it === "guidance") parts.push(ansGuidance(d));
    else parts.push(ansSummary(d));
  }
  turn.html = parts.map(p => p.html).join('<hr class="sep">');
  // one chart per answer keeps it readable; always show it when asked, otherwise for chart-friendly topics
  const ch = parts.flatMap(p => p.charts || []);
  turn.charts = wantChart ? ch.slice(0, 2) : ch.slice(0, 1);
}

const useClaude = () => !!chatKey() && store.get("chatEngine") === "claude";
function askQuestion(q) { if (!q || !q.trim() || CHAT.busy) return; return useClaude() ? askClaude(q) : askLocal(q); }
async function askLocal(question) {
  const d = STATE.d; if (!d) return;
  CHAT.busy = true;
  if (CHAT.forSym !== d.symbol) { CHAT.msgs = []; CHAT.view = []; CHAT.forSym = d.symbol; CHAT.lastIntent = null; }
  CHAT.view = CHAT.view || [];
  CHAT.view.push({ role: "user", text: question });
  const turn = { role: "assistant", text: "", html: "", charts: [], status: "Reading FMP data…", tools: [] };
  CHAT.view.push(turn); renderChat();
  try { await answerLocal(question, turn); }
  catch (e) { turn.error = "Couldn't answer that: " + (e.message || e); }
  finally { turn.status = ""; CHAT.busy = false; renderChat(); }
}

/* ============ search / UI wiring ============ */
(function wire() {
  const input = document.getElementById("tickerInput"), sugg = document.getElementById("sugg");
  attachSearch(input, sugg, sym => load(sym));
  document.getElementById("searchForm").addEventListener("submit", e => { e.preventDefault(); sugg.hidden = true; load(input.value); });
  STATE.tab = store.get("tab") === "peers" ? "peers" : "co";
  STATE.peerMargin = store.get("peerMargin") === "t" ? "t" : "q";
  const keyRow = document.getElementById("keyRow"), keyToggle = document.getElementById("keyToggle"), keyInput = document.getElementById("keyInput");
  keyInput.value = getKey();
  keyToggle.addEventListener("click", () => { keyRow.hidden = !keyRow.hidden; keyToggle.setAttribute("aria-expanded", String(!keyRow.hidden)); });
  document.getElementById("keySave").addEventListener("click", () => {
    store.set("fmpKey", keyInput.value.trim()); keyRow.hidden = true; keyToggle.setAttribute("aria-expanded", "false");
    load(store.get("lastTicker") || "AAPL");
  });
  STATE.incMode = store.get("incMode") || "values";
  STATE.cmp = store.get("cmpMode") === "yoy" ? "yoy" : "qoq";
  STATE.moveWin = store.get("moveWin") || "All";
  STATE.capMode = store.get("capMode") === "abs" ? "abs" : "pct";
  const cmpBtns = document.querySelectorAll("#cmpSeg button");
  const syncCmp = () => cmpBtns.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.c === STATE.cmp)));
  syncCmp();
  cmpBtns.forEach(b => b.addEventListener("click", () => {
    if (STATE.cmp === b.dataset.c) return;
    STATE.cmp = b.dataset.c; store.set("cmpMode", STATE.cmp); syncCmp();
    if (STATE.d) { const y = window.scrollY; render(STATE.d); window.scrollTo(0, y); }
  }));
  let rsT = null, lastW = window.innerWidth;
  window.addEventListener("resize", () => { clearTimeout(rsT); rsT = setTimeout(() => { if (window.innerWidth !== lastW && STATE.px && STATE.px.open) { lastW = window.innerWidth; renderPx(false); } }, 250); });
  document.getElementById("chatFab").addEventListener("click", () => { STATE.chatOpen = true; renderChat(); });
  document.getElementById("chatPane").addEventListener("click", e => { const b = e.target.closest("[data-more]"); if (!b) return; const t = CHAT.view[+b.dataset.more]; if (t) { t.expanded = !t.expanded; renderChatTurn(t); } });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && STATE.chatOpen && !CHAT.busy) { STATE.chatOpen = false; renderChat(); } });
  const appEl = document.getElementById("app");
  appEl.addEventListener("click", e => {
    const t = e.target.closest("[data-evt],[data-pxmode],[data-pxrange],[data-pxclose]");
    if (!t || !STATE.d) return;
    if (t.dataset.evt) openPx("event", t.dataset.evt);
    else if (t.dataset.pxmode) openPx("general");
    else if (t.dataset.pxrange) { STATE.px.range = t.dataset.pxrange; renderPx(false); }
    else if (t.dataset.pxclose) { STATE.px.open = false; renderPx(false); const tb = document.querySelector("#forecast .tbl tr.clk"); if (tb) tb.closest(".panel").scrollIntoView({ block: "nearest" }); }
  });
  appEl.addEventListener("keydown", e => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const t = e.target.closest("[data-evt]"); if (!t || t.tagName === "BUTTON") return;
    e.preventDefault(); openPx("event", t.dataset.evt);
  });
  document.getElementById("app").addEventListener("change", e => {
    const t = e.target; if (!t.dataset || !t.dataset.sel || !STATE.d) return;
    STATE.segSel[t.dataset.sel] = +t.value;
    const y = window.scrollY; render(STATE.d); window.scrollTo(0, y);
    const again = document.getElementById("sel-" + t.dataset.sel); if (again) again.focus();
  });
  load(store.get("lastTicker") || "AAPL");
})();
</script>
